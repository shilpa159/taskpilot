# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Render's free tier does not offer managed MySQL, so this blueprint provisions
# the FastAPI backend and the static frontend, and expects DATABASE_URL to
# point at an external free MySQL instance (e.g. Aiven, PlanetScale, Railway,
# or a small MySQL box you control). See README.md for the exact steps.
#
# Deploy: push this repo to GitHub, then in Render choose
# "New +" -> "Blueprint" and select the repo.

services:
  - type: web
    name: taskpilot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: taskpilot-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
